services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-correlator-backend
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./fraud_correlator.db}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - API_PORT=8000
    networks:
      - correlator-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud-correlator-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - correlator-network
    restart: unless-stopped

networks:
  correlator-network:
    driver: bridge
